<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Fluxo n8n de agente de IA para WhatsApp</title>
<desc id="desc">Workflow com Webhook, WhatsApp Trigger, processamento, AI Agent, OpenAI, memória, Supabase, ferramentas e resposta pelo WhatsApp.</desc>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3a3d45"/></pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .node{fill:#171a20;stroke:#4a4f5b;stroke-width:2}.label{fill:#f4f4f5;font:600 18px Arial,sans-serif}.sub{fill:#9298a5;font:14px Arial,sans-serif}.tiny{fill:#777e8c;font:12px Arial,sans-serif}.line{fill:none;stroke:#747b8b;stroke-width:3}.dash{fill:none;stroke:#8b6cff;stroke-width:2.5;stroke-dasharray:9 8}.port{fill:#8b6cff}.icon{fill:none;stroke:#f4f4f5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="600" rx="18" fill="url(#bg)"/>
<rect width="1200" height="600" rx="18" fill="url(#dots)" opacity=".75"/>

<!-- main flow -->
<path d="M190 180 H245" class="line"/><path d="M385 180 H440" class="line"/><path d="M590 180 H650" class="line"/><path d="M875 180 H930" class="line"/><path d="M1070 180 H1120" class="line"/>
<path d="M235 175 l12 5 -12 5z M430 175 l12 5 -12 5z M640 175 l12 5 -12 5z M920 175 l12 5 -12 5z M1110 175 l12 5 -12 5z" fill="#8b94a6"/>

<!-- Webhook -->
<rect x="45" y="125" width="145" height="110" rx="16" class="node" stroke="#ff5c6c"/>
<circle cx="88" cy="180" r="8" fill="#ff5c6c"/><circle cx="104" cy="164" r="8" fill="#ff5c6c"/><circle cx="120" cy="180" r="8" fill="#ff5c6c"/><path d="M88 180l16-16m0 16l16-16" stroke="#ff5c6c" stroke-width="5"/>
<text x="117" y="260" text-anchor="middle" class="label">Webhook</text><text x="117" y="282" text-anchor="middle" class="sub">POST</text>

<!-- WhatsApp trigger -->
<rect x="245" y="125" width="140" height="110" rx="16" class="node" stroke="#28c76f"/>
<circle cx="315" cy="175" r="28" fill="#28c76f"/><path d="M302 196l5-10a22 22 0 1 1 8 5z" fill="#fff"/><path d="M308 168c2 9 8 15 17 18l5-5" stroke="#28c76f" stroke-width="3" fill="none"/>
<text x="315" y="260" text-anchor="middle" class="label">WhatsApp Trigger</text><text x="315" y="282" text-anchor="middle" class="sub">New Message</text>

<!-- Process -->
<rect x="440" y="125" width="150" height="110" rx="16" class="node" stroke="#f0a12b"/>
<text x="515" y="190" text-anchor="middle" fill="#f0a12b" font-size="38" font-family="monospace">{ }</text>
<text x="515" y="260" text-anchor="middle" class="label">Processar mensagem</text><text x="515" y="282" text-anchor="middle" class="sub">Set / Format</text>

<!-- AI Agent -->
<rect x="650" y="105" width="225" height="150" rx="18" class="node" stroke="#8b6cff" stroke-width="3"/>
<circle cx="762" cy="157" r="23" fill="#f4f4f5"/><rect x="741" y="147" width="42" height="28" rx="8" fill="#171a20"/><circle cx="751" cy="161" r="3" fill="#f4f4f5"/><circle cx="773" cy="161" r="3" fill="#f4f4f5"/><path d="M762 140v-9M755 131h14" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round"/>
<text x="762" y="205" text-anchor="middle" class="label" font-size="20">AI Agent</text><text x="762" y="227" text-anchor="middle" class="sub">Tools Agent</text>
<circle cx="650" cy="180" r="6" class="port"/><circle cx="875" cy="180" r="6" class="port"/><circle cx="710" cy="255" r="6" class="port"/><circle cx="762" cy="255" r="6" class="port"/><circle cx="814" cy="255" r="6" class="port"/>

<!-- response -->
<rect x="930" y="125" width="140" height="110" rx="16" class="node" stroke="#3e8cff"/>
<rect x="969" y="156" width="42" height="39" rx="5" fill="#3e8cff"/><path d="M978 169l5 5 8-10M978 184l5 5 8-10" stroke="#fff" stroke-width="3" fill="none"/>
<text x="1000" y="260" text-anchor="middle" class="label">Gerar resposta</text><text x="1000" y="282" text-anchor="middle" class="sub">Set / Format</text>

<rect x="1120" y="125" width="70" height="110" rx="16" class="node" stroke="#28c76f"/>
<circle cx="1155" cy="177" r="25" fill="#28c76f"/><path d="M1143 198l4-9a19 19 0 1 1 7 4z" fill="#fff"/><path d="M1148 169c2 8 7 13 14 16l4-4" stroke="#28c76f" stroke-width="3" fill="none"/>
<text x="1155" y="260" text-anchor="middle" class="label" font-size="13">WhatsApp</text><text x="1155" y="282" text-anchor="middle" class="sub">Send</text>

<!-- agent branches -->
<path d="M710 255 C710 315 560 330 500 380" class="dash"/><path d="M762 255 C762 320 650 340 625 380" class="dash"/><path d="M814 255 C814 320 785 340 750 380" class="dash"/><path d="M814 255 C880 315 910 340 875 380" class="dash"/>
<text x="500" y="354" text-anchor="middle" class="tiny">Chat Model</text><text x="625" y="354" text-anchor="middle" class="tiny">Memory</text><text x="750" y="354" text-anchor="middle" class="tiny">Tool</text><text x="875" y="354" text-anchor="middle" class="tiny">Tool</text>

<rect x="435" y="380" width="130" height="105" rx="16" class="node"/><circle cx="500" cy="424" r="25" fill="none" stroke="#fff" stroke-width="4"/><path d="M488 432c-8-8-4-20 5-24 10-4 19 1 20 9 2 9-5 18-14 18-4 0-7-1-11-3z" class="icon"/><text x="500" y="515" text-anchor="middle" class="label" font-size="14">OpenAI Chat Model</text><text x="500" y="536" text-anchor="middle" class="sub">GPT-4o</text>

<rect x="560" y="380" width="130" height="105" rx="16" class="node"/><ellipse cx="625" cy="415" rx="20" ry="8" fill="#fff"/><path d="M605 415v25c0 5 9 8 20 8s20-3 20-8v-25M605 427c0 5 9 8 20 8s20-3 20-8M605 439c0 5 9 8 20 8s20-3 20-8" fill="none" stroke="#fff" stroke-width="3"/><text x="625" y="515" text-anchor="middle" class="label">Memória</text><text x="625" y="536" text-anchor="middle" class="sub">Window Buffer</text>

<rect x="685" y="380" width="130" height="105" rx="16" class="node"/><path d="M756 399l-27 37h22l-8 28 29-40h-22z" fill="#2bdc8f" filter="url(#glow)"/><text x="750" y="515" text-anchor="middle" class="label">Supabase</text><text x="750" y="536" text-anchor="middle" class="sub">Buscar / Salvar</text>

<rect x="810" y="380" width="130" height="105" rx="16" class="node"/><circle cx="875" cy="424" r="25" fill="none" stroke="#4c7cff" stroke-width="4"/><path d="M850 424h50M875 399c8 7 12 15 12 25s-4 18-12 25M875 399c-8 7-12 15-12 25s4 18 12 25M854 408h42M854 440h42" fill="none" stroke="#4c7cff" stroke-width="2"/>
<text x="875" y="515" text-anchor="middle" class="label">Ferramentas</text><text x="875" y="536" text-anchor="middle" class="sub">APIs e automações</text>
</svg>