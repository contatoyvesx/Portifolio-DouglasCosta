    <g transform="translate(360 205)"><rect width="255" height="245" rx="20" fill="#071321" stroke="#116dce"/><text x="128" y="100" text-anchor="middle" fill="#4dbaff" font-size="58" font-weight="700">Py</text><rect x="88" y="52" width="80" height="75" rx="10" fill="none" stroke="#167ff0" stroke-width="2" opacity=".7"/><text x="128" y="145" text-anchor="middle" fill="white" font-size="19" font-weight="700">TRANSFORMAÇÃO</text><text x="128" y="178" text-anchor="middle" fill="#9fb0c4" font-size="15">Tratamento e limpeza</text><text x="128" y="201" text-anchor="middle" fill="#9fb0c4" font-size="15">dos dados com Pandas</text></g>
    <g transform="translate(675 205)"><rect width="255" height="245" rx="20" fill="#071321" stroke="#116dce"/><rect x="55" y="92" width="18" height="38" rx="3" fill="#1688ff"/><rect x="82" y="72" width="18" height="58" rx="3" fill="#1688ff"/><rect x="109" y="50" width="18" height="80" rx="3" fill="#19b8ff"/><circle cx="151" cy="92" r="29" fill="none" stroke="#19b8ff" stroke-width="7"/><path d="M172 113l25 25" stroke="#19b8ff" stroke-width="7"/><text x="128" y="145" text-anchor="middle" fill="white" font-size="19" font-weight="700">ANÁLISE EXPLORATÓRIA</text><text x="128" y="178" text-anchor="middle" fill="#9fb0c4" font-size="15">Identificação de padrões</text><text x="128" y="201" text-anchor="middle" fill="#9fb0c4" font-size="15">e insights</text></g>
