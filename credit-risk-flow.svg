<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do projeto de Data Science</title>
  <desc id="desc">Coleta de dados via API, transformação, análise exploratória, machine learning e avaliação de risco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050b14"/><stop offset="1" stop-color="#02060b"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1677ff"/><stop offset="1" stop-color="#19b8ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="620" rx="30" fill="url(#bg)"/>
  <path d="M0 120 Q300 30 650 90 T1600 35" fill="none" stroke="#0b58bd" stroke-opacity=".18" stroke-width="2"/>
  <text x="70" y="72" fill="#22a8ff" font-family="Arial,sans-serif" font-size="20" letter-spacing="9">DATA SCIENCE</text>
  <line x1="70" y1="95" x2="230" y2="95" stroke="#19b8ff" stroke-width="3"/>
  <g font-family="Arial,sans-serif" fill="#f4f7fb"><text x="70" y="150" font-size="46" font-weight="700">FLUXO DO PROJETO</text></g>
  <g stroke="#147bff" stroke-width="3" fill="none" filter="url(#glow)"><path d="M300 325 H360"/><path d="M615 325 H675"/><path d="M930 325 H990"/><path d="M1245 325 H1305"/></g>
  <g fill="#19b8ff" filter="url(#glow)"><circle cx="360" cy="325" r="6"/><circle cx="675" cy="325" r="6"/><circle cx="990" cy="325" r="6"/><circle cx="1305" cy="325" r="6"/></g>
  <g font-family="Arial,sans-serif">
