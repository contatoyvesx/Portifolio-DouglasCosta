    <g transform="translate(1305 205)"><rect width="255" height="245" rx="20" fill="#071321" stroke="#116dce"/><path d="M60 112 A68 68 0 0 1 196 112" fill="none" stroke="#163452" stroke-width="18"/><path d="M60 112 A68 68 0 0 1 168 55" fill="none" stroke="url(#blue)" stroke-width="18"/><line x1="128" y1="112" x2="151" y2="70" stroke="white" stroke-width="5"/><circle cx="128" cy="112" r="8" fill="white"/><text x="128" y="155" text-anchor="middle" fill="white" font-size="19" font-weight="700">AVALIAÇÃO DE RISCO</text><text x="128" y="188" text-anchor="middle" fill="#9fb0c4" font-size="15">Score de crédito e</text><text x="128" y="211" text-anchor="middle" fill="#9fb0c4" font-size="15">probabilidade de inadimplência</text></g>
  </g>
</svg>